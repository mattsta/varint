name: Comprehensive CI/CD

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master, develop ]

# An explicit bash shell runs every step with -eo pipefail, so a command
# piped into tee still fails its step.
defaults:
  run:
    shell: bash

jobs:
  # Strict-warning compile of every library source (GCC + Clang)
  compiler-warnings:
    name: Compiler Warnings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang cmake build-essential

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew untap aws/tap 2>/dev/null || true
          for pkg in gcc llvm cmake; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock

      - name: Compile every source with warnings as errors
        run: uv run --project devtools --no-dev varintdev warnings gcc clang

  # Every ctest suite under ASan + UBSan, then with junk-filled memory
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake build-essential

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew untap aws/tap 2>/dev/null || true
          for pkg in gcc cmake; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock

      - name: Run unit tests (ASan + UBSan)
        run: uv run --project devtools --no-dev varintdev ctest both

      - name: Run unit tests (uninitialized-memory audit)
        run: uv run --project devtools --no-dev varintdev ctest uninit

  # Comprehensive Example/Demo Testing
  examples-comprehensive:
    name: Examples (${{ matrix.os }}, sanitizers)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake build-essential

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew untap aws/tap 2>/dev/null || true
          for pkg in gcc cmake; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Run comprehensive example tests
        timeout-minutes: 15
        run: |
          chmod +x scripts/test/test_all_comprehensive.sh
          ./scripts/test/test_all_comprehensive.sh 2>&1 | tee comprehensive_test_output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-test-output-${{ matrix.os }}
          path: comprehensive_test_output.log
          retention-days: 30

  # Build System Verification
  build-verification:
    name: CMake Build (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        compiler: [gcc, clang]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang cmake build-essential

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew untap aws/tap 2>/dev/null || true
          for pkg in gcc llvm cmake; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Set compiler environment
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: CMake configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$CC"

      - name: CMake build
        run: cmake --build build --parallel "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Run CTest unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run comprehensive test suite
        run: cmake --build build --target varint-test-comprehensive

  # ThreadSanitizer over every ctest suite
  thread-sanitizer:
    name: ThreadSanitizer (ubuntu-26.04)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake build-essential

      # TSan's shadow-memory layout does not fit the kernel's default
      # 32-bit mmap randomization.
      - name: Reduce mmap randomization for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock

      - name: Run unit tests (TSan)
        run: uv run --project devtools --no-dev varintdev ctest tsan

  # Static Analysis with cppcheck
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock

      - name: Run cppcheck on src/
        run: uv run --project devtools --no-dev varintdev cppcheck 2>&1 | tee cppcheck_output.log

      - name: Upload static analysis results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis
          path: cppcheck_output.log
          retention-days: 30

  # Lint and type-check the Python tooling the other jobs run
  devtools:
    name: Devtools (ruff + mypy)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock

      - name: ruff format
        run: uv run --project devtools ruff format --check devtools/src

      - name: ruff check
        run: uv run --project devtools ruff check devtools/src

      - name: mypy
        run: uv run --project devtools mypy devtools/src

  summary:
    name: CI Summary
    runs-on: ubuntu-26.04
    needs:
      - compiler-warnings
      - unit-tests
      - examples-comprehensive
      - build-verification
      - thread-sanitizer
      - static-analysis
      - devtools
    if: always()

    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
