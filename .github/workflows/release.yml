name: Release Verification

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]

# An explicit bash shell runs every step with -eo pipefail, so a command
# piped into tee still fails its step.
defaults:
  run:
    shell: bash

jobs:
  release-verification:
    name: Release Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-26.04, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang cmake build-essential

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew untap aws/tap 2>/dev/null || true
          for pkg in gcc llvm cmake; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock

      - name: Compile every source with warnings as errors (GCC + Clang)
        run: uv run --project devtools --locked --no-dev varintdev warnings gcc clang

      - name: Run every unit test (ASan + UBSan, uninitialized-memory audit)
        run: uv run --project devtools --locked --no-dev varintdev ctest both uninit

      - name: Run ALL comprehensive examples
        timeout-minutes: 20
        run: |
          chmod +x scripts/test/test_all_comprehensive.sh
          ./scripts/test/test_all_comprehensive.sh 2>&1 | tee release_test_output.log

      - name: Create release archive
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p varint-$VERSION
          cp -r src/ varint-$VERSION/
          cp -r docs/ varint-$VERSION/
          cp -r examples/ varint-$VERSION/
          cp CMakeLists.txt README.md LICENSE varint-$VERSION/ 2>/dev/null || true
          tar -czf varint-$VERSION.tar.gz varint-$VERSION/
          echo "✅ Release archive created: varint-$VERSION.tar.gz"

      - name: Upload release artifacts
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: varint-*.tar.gz
          retention-days: 90

  release-quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-26.04
    needs: [release-verification]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Quality gate summary
        run: |
          {
            echo "# Release Quality Gate"
            echo ""
            echo "Version ${GITHUB_REF#refs/tags/} passed strict warnings (GCC + Clang),"
            echo "every unit test under ASan + UBSan and the uninitialized-memory audit,"
            echo "and every example under sanitizers on Linux and macOS."
          } >> "$GITHUB_STEP_SUMMARY"
