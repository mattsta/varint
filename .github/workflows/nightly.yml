name: Nightly Extended Testing

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

# An explicit bash shell runs every step with -eo pipefail, so a command
# piped into tee still fails its step.
defaults:
  run:
    shell: bash

jobs:
  extended-sanitizer-testing:
    name: Extended Sanitizers (${{ matrix.mode }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mode: [asan, ubsan, tsan, uninit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang cmake build-essential

      # TSan's shadow-memory layout does not fit the kernel's default
      # 32-bit mmap randomization.
      - name: Reduce mmap randomization for TSan
        if: matrix.mode == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock

      - name: Run every unit test (${{ matrix.mode }})
        timeout-minutes: 30
        run: uv run --project devtools --locked --no-dev varintdev ctest ${{ matrix.mode }} 2>&1 | tee all_tests_output.log

      - name: Run comprehensive examples
        timeout-minutes: 30
        run: |
          chmod +x scripts/test/test_all_comprehensive.sh
          ./scripts/test/test_all_comprehensive.sh 2>&1 | tee comprehensive_output.log

      - name: Upload nightly test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.mode }}-results
          path: |
            comprehensive_output.log
            all_tests_output.log
          retention-days: 7

  # One job per compiler the ubuntu-26.04 image ships
  # (actions/runner-images: images/ubuntu/Ubuntu2604-Readme.md). This trails
  # upstream (GCC 16, Clang 23 are released but not in the image); add newer
  # compilers here when the runner image ships them.
  compiler-matrix:
    name: Compiler Matrix (${{ matrix.compiler }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-13, gcc-14, gcc-15, clang-20, clang-21, clang-22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock

      - name: Strict warnings with ${{ matrix.compiler }}
        run: uv run --project devtools --locked --no-dev varintdev warnings ${{ matrix.compiler }} 2>&1 | tee ${{ matrix.compiler }}_results.log

      - name: Upload compiler matrix results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-matrix-${{ matrix.compiler }}
          path: ${{ matrix.compiler }}_results.log
          retention-days: 7

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake build-essential valgrind

      - name: Build performance tests
        run: |
          gcc -O3 -I. -o varintCompare_perf \
              src/varintCompare.c \
              src/varintExternal.c \
              src/varintExternalBigEndian.c \
              src/varintTagged.c \
              src/varintChained.c \
              src/varintChainedSimple.c \
              -lm

      - name: Run performance benchmarks
        timeout-minutes: 10
        run: |
          echo "=== Performance Benchmarks ===" | tee perf_results.log
          timeout 300 ./varintCompare_perf 100 2>&1 | tee -a perf_results.log || true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-benchmarks
          path: perf_results.log
          retention-days: 30

  valgrind-analysis:
    name: Valgrind Memory Analysis
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake build-essential valgrind

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock

      - name: Run every unit test under valgrind memcheck
        timeout-minutes: 60
        run: uv run --project devtools --locked --no-dev varintdev ctest valgrind 2>&1 | tee valgrind_output.log

      - name: Upload valgrind results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-analysis
          path: valgrind_output.log
          retention-days: 7
          if-no-files-found: ignore

  summary:
    name: Nightly Summary
    runs-on: ubuntu-26.04
    needs: [extended-sanitizer-testing, compiler-matrix, performance-benchmarks, valgrind-analysis]
    if: always()

    steps:
      - name: Generate nightly summary
        run: |
          echo "# Nightly Extended Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Extended Sanitizers | ${{ needs.extended-sanitizer-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compiler Matrix | ${{ needs.compiler-matrix.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-benchmarks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Valgrind | ${{ needs.valgrind-analysis.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
