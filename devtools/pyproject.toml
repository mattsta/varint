[project]
name = "varintdev"
version = "0.1.0"
description = "Developer and CI tooling for the varint library"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
varintdev = "varintdev.cli:main"

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14", "types-pyyaml>=6.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PTH"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
